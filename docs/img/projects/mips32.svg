<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><style>
.box{fill:rgba(255,255,255,0.04);stroke:#3f6c9e;stroke-width:1.5}
.box-hi{fill:rgba(89,214,255,0.07);stroke:#59d6ff;stroke-width:1.5}
.box-am{fill:rgba(255,194,103,0.07);stroke:#ffc267;stroke-width:1.5}
.k{fill:#cfe0f2;font-family:monospace;font-size:11}
.dk{fill:#8a9cba;font-family:monospace;font-size:10}
.am{fill:#ffc267;font-family:monospace;font-size:10;font-weight:bold}
.cy{fill:#59d6ff;font-family:monospace;font-size:10;font-weight:bold}
.l{stroke:#59d6ff;stroke-width:1.5;fill:none}
.la{stroke:#ffc267;stroke-width:1.5;fill:none}
.lm{stroke:#8a9cba;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>

<text x="15" y="40" class="cy">classic MIPS32 5-stage pipeline</text>
<g font-family="monospace" font-size="10" text-anchor="middle">
<rect x="15" y="90" width="88" height="56" class="box-hi"/><text x="59" y="116" class="k">IF</text><text x="59" y="132" class="dk">fetch</text>
<rect x="117" y="90" width="88" height="56" class="box"/><text x="161" y="116" class="k">ID</text><text x="161" y="132" class="dk">decode/regfile</text>
<rect x="219" y="90" width="88" height="56" class="box"/><text x="263" y="116" class="k">EX</text><text x="263" y="132" class="dk">ALU / addr</text>
<rect x="321" y="90" width="88" height="56" class="box"/><text x="365" y="116" class="k">MEM</text><text x="365" y="132" class="dk">load/store</text>
<rect x="423" y="90" width="88" height="56" class="box-hi"/><text x="467" y="116" class="k">WB</text><text x="467" y="132" class="dk">write-back</text>
</g>
<g class="l"><line x1="103" y1="118" x2="117" y2="118"/><line x1="205" y1="118" x2="219" y2="118"/><line x1="307" y1="118" x2="321" y2="118"/><line x1="409" y1="118" x2="423" y2="118"/></g>
<line x1="59" y1="90" x2="59" y2="60" class="lm"/><polygon points="59,60 55,68 63,68" fill="#8a9cba"/>
<text x="74" y="54" class="dk">NPC ← PC+1</text>
<text x="15" y="210" class="dk">GPR R0–R31 · encoding R/I/J · decode runs in parallel with register read</text>
</svg>