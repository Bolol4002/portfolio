<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><style>
.box{fill:rgba(255,255,255,0.04);stroke:#3f6c9e;stroke-width:1.5}
.box-hi{fill:rgba(89,214,255,0.07);stroke:#59d6ff;stroke-width:1.5}
.box-am{fill:rgba(255,194,103,0.07);stroke:#ffc267;stroke-width:1.5}
.k{fill:#cfe0f2;font-family:monospace;font-size:11}
.dk{fill:#8a9cba;font-family:monospace;font-size:10}
.am{fill:#ffc267;font-family:monospace;font-size:10;font-weight:bold}
.cy{fill:#59d6ff;font-family:monospace;font-size:10;font-weight:bold}
.l{stroke:#59d6ff;stroke-width:1.5;fill:none}
.la{stroke:#ffc267;stroke-width:1.5;fill:none}
.lm{stroke:#8a9cba;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>

<g font-family="monospace" font-size="9" text-anchor="middle">
<rect x="20" y="60" width="100" height="60" class="box"/><text x="70" y="85" class="k">GRAPH</text><text x="70" y="99" class="dk">BFS · DFS</text><text x="70" y="112" class="dk">Dijkstra</text>
<rect x="140" y="60" width="120" height="60" class="box"/><text x="200" y="85" class="k">MST</text><text x="200" y="99" class="dk">Kruskal</text><text x="200" y="112" class="dk">Prim</text>
<rect x="280" y="60" width="110" height="60" class="box-hi"/><text x="335" y="85" class="cy">PARTITION</text><text x="335" y="99" class="dk">Kernighan–Lin</text>
<rect x="410" y="60" width="100" height="60" class="box-am"/><text x="460" y="85" class="am">OPTIMIZE</text><text x="460" y="99" class="dk">simulated</text><text x="460" y="112" class="dk">annealing</text>
</g>
<g class="l"><line x1="120" y1="90" x2="140" y2="90"/><line x1="260" y1="90" x2="280" y2="90"/><line x1="390" y1="90" x2="410" y2="90"/></g>
<line x1="200" y1="176" x2="200" y2="120" class="lm"/>
<rect x="90" y="176" width="220" height="54" class="box"/>
<text x="200" y="199" class="k" text-anchor="middle">VERILOG LAB · Exp01–Exp10</text>
<text x="200" y="216" class="dk" text-anchor="middle">RTL + matching testbenches · run_all_sims.tcl</text>
<text x="460" y="250" class="dk" font-family="monospace" font-size="10">EDA algorithms in Python + RTL verification</text>
</svg>