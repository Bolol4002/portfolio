<text x="95" y="90" class="dk" text-anchor="middle">dynamic switch</text>
<line x1="120" y1="102" x2="210" y2="160" class="l"/>
<rect x="212" y="120" width="120" height="90" class="box"/>
<text x="272" y="150" class="k" text-anchor="middle">DRIVER</text>
<text x="272" y="166" class="dk" text-anchor="middle">stimulus + mode</text>
<line x1="334" y1="165" x2="390" y2="165" class="l"/>
<polygon points="390,165 380,160 380,170" fill="#59d6ff"/>
<rect x="392" y="60" width="80" height="210" class="box-hi"/>
<text x="432" y="150" class="cy" text-anchor="middle" transform="rotate(0)">DUT</text>
<text x="432" y="170" class="dk" text-anchor="middle">adaptive</text>
