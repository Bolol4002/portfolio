<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><style>
.box{fill:rgba(255,255,255,0.04);stroke:#3f6c9e;stroke-width:1.5}
.box-hi{fill:rgba(89,214,255,0.07);stroke:#59d6ff;stroke-width:1.5}
.box-am{fill:rgba(255,194,103,0.07);stroke:#ffc267;stroke-width:1.5}
.k{fill:#cfe0f2;font-family:monospace;font-size:11}
.dk{fill:#8a9cba;font-family:monospace;font-size:10}
.am{fill:#ffc267;font-family:monospace;font-size:10;font-weight:bold}
.cy{fill:#59d6ff;font-family:monospace;font-size:10;font-weight:bold}
.l{stroke:#59d6ff;stroke-width:1.5;fill:none}
.la{stroke:#ffc267;stroke-width:1.5;fill:none}
.lm{stroke:#8a9cba;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>

<rect x="90" y="30" width="330" height="80" class="box-hi"/>
<text x="255" y="55" class="cy" text-anchor="middle">ADAPTIVE CONTROL WRAPPER</text>
<text x="255" y="76" class="k" text-anchor="middle">mode_i: 0 = low-power · 1 = high-performance</text>
<text x="255" y="94" class="dk" text-anchor="middle">runtime selection without touching the datapath</text>
<line x1="140" y1="112" x2="140" y2="160" class="l"/>
<line x1="370" y1="112" x2="370" y2="160" class="la"/>
<rect x="40" y="162" width="200" height="70" class="box"/>
<text x="140" y="186" class="k" text-anchor="middle">LOW-POWER CTRL</text>
<text x="140" y="204" class="dk" text-anchor="middle">gated · minimal switching</text>
<rect x="280" y="162" width="200" height="70" class="box"/>
<text x="380" y="186" class="k" text-anchor="middle">HIGH-PERF CTRL</text>
<text x="380" y="204" class="dk" text-anchor="middle">parallel · precomputed signals</text>
<line x1="140" y1="234" x2="140" y2="270" class="lm"/>
<line x1="380" y1="234" x2="380" y2="270" class="lm"/>
<rect x="60" y="182" width="400" height="18" class="l" opacity="0"/>
<text x="255" y="285" class="am" text-anchor="middle" font-family="monospace" font-size="10">metrics: dynamic power · LUT/FF · critical path</text>
</svg>