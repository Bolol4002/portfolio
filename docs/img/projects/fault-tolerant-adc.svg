<text x="85" y="162" class="dk" text-anchor="middle">analog in</text>
<line x1="142" y1="148" x2="200" y2="148" class="l"/>
<polygon points="200,148 190,143 190,153" fill="#59d6ff"/>
<rect x="202" y="60" width="140" height="176" class="box-hi"/>
<text x="272" y="120" class="cy" text-anchor="middle">FAULT GATE</text>
<text x="272" y="142" class="k" text-anchor="middle">Vref in 7–9 V ? pass : block</text>
<text x="272" y="200" class="am" text-anchor="middle">error_flag</text>
<line x1="342" y1="130" x2="400" y2="130" class="l"/>
<polygon points="400,130 390,125 390,135" fill="#59d6ff"/>
<rect x="402" y="80" width="118" height="100" class="box"/>
<text x="461" y="110" class="k" text-anchor="middle">COMPARATOR</text>
