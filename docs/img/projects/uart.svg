<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><style>
.box{fill:rgba(255,255,255,0.04);stroke:#3f6c9e;stroke-width:1.5}
.box-hi{fill:rgba(89,214,255,0.07);stroke:#59d6ff;stroke-width:1.5}
.box-am{fill:rgba(255,194,103,0.07);stroke:#ffc267;stroke-width:1.5}
.k{fill:#cfe0f2;font-family:monospace;font-size:11}
.dk{fill:#8a9cba;font-family:monospace;font-size:10}
.am{fill:#ffc267;font-family:monospace;font-size:10;font-weight:bold}
.cy{fill:#59d6ff;font-family:monospace;font-size:10;font-weight:bold}
.l{stroke:#59d6ff;stroke-width:1.5;fill:none}
.la{stroke:#ffc267;stroke-width:1.5;fill:none}
.lm{stroke:#8a9cba;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>

<line x1="30" y1="170" x2="490" y2="170" class="lm"/>
<text x="30" y="152" class="am">TX line</text>
<g font-family="monospace" font-size="10" text-anchor="middle">
<rect x="50" y="130" width="36" height="40" class="box-am"/><text x="68" y="156" class="l">?</text>
</g>
<g fill="none" stroke="#59d6ff">
<path d="M50 170 h20 v-40 h34 v40"/>
</g>
<g font-family="monospace" font-size="9" text-anchor="middle">
<text x="68" y="192" class="am">START</text>
<text x="120" y="192" class="dk">0 (low edge)</text>
<text x="220" y="192" class="dk">data bits D0..D7 (LSB first)</text>
<text x="330" y="192" class="dk">parity</text>
<text x="380" y="192" class="dk">STOP</text>
</g>
<g font-family="monospace" font-size="8" text-anchor="middle" fill="#8a9cba">
<text x="68" y="212">low</text><text x="120" y="212">frame drawn low = logic 0</text><text x="330" y="212">5–8 bits</text>
</g>
<rect x="50" y="130" width="10" height="40" class="l" fill="none"/>
<text x="115" y="50" class="cy" font-family="monospace" font-size="11">baud-rate generator · uart_tx</text>
<text x="115" y="70" class="dk" font-family="monospace" font-size="10">async serial · no shared clock · 9600/19200/38400</text>
</svg>