<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><style>
.box{fill:rgba(255,255,255,0.04);stroke:#3f6c9e;stroke-width:1.5}
.box-hi{fill:rgba(89,214,255,0.07);stroke:#59d6ff;stroke-width:1.5}
.box-am{fill:rgba(255,194,103,0.07);stroke:#ffc267;stroke-width:1.5}
.k{fill:#cfe0f2;font-family:monospace;font-size:11}
.dk{fill:#8a9cba;font-family:monospace;font-size:10}
.am{fill:#ffc267;font-family:monospace;font-size:10;font-weight:bold}
.cy{fill:#59d6ff;font-family:monospace;font-size:10;font-weight:bold}
.l{stroke:#59d6ff;stroke-width:1.5;fill:none}
.la{stroke:#ffc267;stroke-width:1.5;fill:none}
.lm{stroke:#8a9cba;stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>

<rect x="30" y="90" width="140" height="70" class="box"/>
<text x="100" y="114" class="k" text-anchor="middle">cpu_log.txt</text>
<g font-family="monospace" font-size="8" text-anchor="start" fill="#8a9cba">
<text x="45" y="132">0x0  ADD  r1 r2 r3</text>
<text x="45" y="144">0x1  LW   r4 0(r1)</text>
</g>
<line x1="172" y1="125" x2="230" y2="125" class="l"/>
<polygon points="230,125 220,120 220,130" fill="#59d6ff"/>
<rect x="232" y="70" width="120" height="90" class="box-hi"/>
<text x="292" y="96" class="cy" text-anchor="middle">PARSER</text>
<text x="292" y="116" class="k" text-anchor="middle">regex +</text>
<text x="292" y="132" class="k" text-anchor="middle">opcode/cycle extraction</text>
<line x1="354" y1="125" x2="400" y2="125" class="l"/>
<rect x="402" y="70" width="100" height="90" class="box-am"/>
<text x="452" y="96" class="am" text-anchor="middle">SUMMARY</text>
<text x="452" y="114" class="dk" text-anchor="middle">opcode profiles</text>
<text x="452" y="130" class="dk" text-anchor="middle">cycle stats</text>
<text x="292" y="205" class="k" font-family="monospace" font-size="10" text-anchor="middle">automates performance-summary generation</text>
</svg>